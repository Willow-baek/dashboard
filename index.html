<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#eef4f7">
  <title>우리 집 대시보드</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="weather-scene.css">
  <link rel="stylesheet" href="legacy-look.css?v=20261013-sound-default">
  <script defer src="vendor/rrule.js"></script>
  <script defer src="vendor/lucide.min.js"></script>
  <script defer src="config.js"></script>
  <script defer src="schedule.js?v=20261013-packages"></script>
  <script defer src="weather-scene.js"></script>
  <script defer src="app.js?v=20261013-sound-default"></script>
</head>
<body>
  <div id="bg-wrap" aria-hidden="true">
    <div id="sun"><div id="sun-rays"></div></div>
    <div id="moon"></div>
    <div id="clouds-wrap"></div>
    <div id="fog-wrap"></div>
    <canvas id="bg-canvas"></canvas>
    <div id="lightning"></div>
  </div>
  <main id="dashboard">
    <button id="weekly-toggle" class="card" aria-expanded="false" aria-controls="calendar-panel" title="주간 달력 열기">
      <span id="weekly-row"></span><span class="calendar-indicator"><i data-lucide="calendar-days"></i><i data-lucide="chevron-down"></i></span>
    </button>

    <section id="calendar-panel" class="card" hidden aria-label="일정 달력">
      <div class="calendar-toolbar">
        <div class="calendar-heading"><h2 id="calendar-title"></h2><span id="calendar-mode-label"></span></div>
        <div class="calendar-controls">
          <div class="segmented"><button id="mode-week" aria-pressed="true">주간</button><button id="mode-month" aria-pressed="false">월간</button></div>
          <button id="calendar-prev" class="icon-button" title="이전" aria-label="이전"><i data-lucide="chevron-left"></i></button>
          <button id="calendar-today" class="text-button">오늘</button>
          <button id="calendar-next" class="icon-button" title="다음" aria-label="다음"><i data-lucide="chevron-right"></i></button>
          <button id="calendar-close" class="icon-button" title="달력 닫기" aria-label="달력 닫기"><i data-lucide="x"></i></button>
        </div>
      </div>
      <div id="calendar-grid"></div>
    </section>

    <section class="day-header card" aria-label="현재 날짜와 시각">
      <div><p id="full-date"></p><h1 id="day-title">오늘</h1></div>
      <time id="clock"></time>
    </section>

    <section class="message-band card" aria-label="오늘의 한마디">
      <p id="message-source" hidden>오늘의 한마디</p>
      <span id="sync-status" class="sr-only" role="status">일정 불러오는 중</span>
      <div class="message-body"><span id="message-symbol" aria-hidden="true">🙋🏻‍♀️</span><p id="message-text">날씨를 확인하고 있어. 나가기 전에 비 오는지 보고, 쌀쌀하면 겉옷 챙겨가.</p></div>
    </section>

    <div class="schedule-layout card">
      <section class="today-section" aria-labelledby="today-heading">
        <div hidden><h2 id="today-heading">오늘 일정</h2><span id="today-count"></span></div>
        <div id="today-events" class="today-events"><p class="empty">일정을 불러오고 있어요.</p></div>
      </section>
      <section class="upcoming-section" aria-label="다가오는 일정">
        <div class="section-heading"><h2>이번 주</h2><span id="week-range"></span></div>
        <div id="week-events"></div>
        <div class="section-heading later-heading"><h2>이후 일정</h2><span>앞으로 4주</span></div>
        <div id="later-events"></div>
        <div id="pending-section" hidden><div class="section-heading later-heading"><h2>예약 확인</h2></div><div id="pending-events"></div></div>
      </section>
    </div>

    <footer class="card">
      <span id="weather-summary"><i data-lucide="cloud-sun"></i><span id="weather-small">서교동 · 날씨 확인 중</span></span>
      <button id="facility-toggle" class="text-button" aria-expanded="false" aria-controls="facility-panel"><i data-lucide="building-2"></i> 시설 안내</button>
      <div class="header-tools">
        <button id="sound-toggle" class="icon-button" title="음성 알림 켜기" aria-label="음성 알림 켜기" aria-pressed="false"><i data-lucide="volume-x"></i></button>
        <button id="refresh" class="icon-button" title="새로고침" aria-label="새로고침"><i data-lucide="refresh-cw"></i></button>
      </div>
    </footer>
    <aside id="facility-panel" class="card" hidden aria-label="시설 안내">
      <div><strong>헬스장</strong><span>운영 중단</span></div>
      <div><strong>옥상</strong><span>폐쇄</span></div>
      <div><strong>도서관</strong><span id="library-hours">운영시간 확인 필요</span></div>
    </aside>
  </main>

  <div id="detail-overlay" class="overlay" hidden>
    <section id="detail-dialog" class="dialog card" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1">
      <button id="detail-close" class="icon-button dialog-close" title="닫기" aria-label="닫기"><i data-lucide="x"></i></button>
      <p id="detail-label" class="eyebrow"></p><h2 id="detail-title"></h2><div id="detail-content"></div>
    </section>
  </div>
  <div id="alert" hidden role="alert"><i data-lucide="bell-ring"></i><div><strong id="alert-title"></strong><p id="alert-text"></p></div><button id="alert-close" class="icon-button" aria-label="알림 닫기" title="알림 닫기"><i data-lucide="x"></i></button></div>
</body>
</html>
